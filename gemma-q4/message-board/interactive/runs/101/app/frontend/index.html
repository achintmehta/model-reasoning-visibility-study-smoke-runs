<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real-time Message Board</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 600px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      #messages {
        border: 1px solid #ccc;
        height: 400px;
        overflow-y: auto;
        padding: 1rem;
        margin-bottom: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .message {
        background: #f4f4f4;
        padding: 0.5rem;
        border-radius: 4px;
      }
      .message-time {
        font-size: 0.75rem;
        color: #666;
        margin-left: 0.5rem;
      }
      form {
        display: flex;
        gap: 0.5rem;
      }
      input {
        flex-grow: 1;
        padding: 0.5rem;
      }
      button {
        padding: 0.5rem 1rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Message Board</h1>
    <div id="messages"></div>
    <form id="message-form">
      <input type="text" id="message-input" placeholder="Type a message..." required />
      <button type="submit">Send</button>
    </form>
    <script type="module" src="/main.js"></script>
  </body>
</html>
