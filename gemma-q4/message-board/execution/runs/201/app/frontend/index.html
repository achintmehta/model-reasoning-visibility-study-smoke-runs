<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Message Board</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 2rem auto;
            padding: 0 1rem;
            background-color: #f4f4f9;
        }
        #messages {
            list-style: none;
            padding: 0;
            margin-bottom: 2rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
            max-height: 400px;
            overflow-y: auto;
        }
        #messages li {
            padding: 0.75rem;
            border-bottom: 1px solid #eee;
        }
        #messages li:last-child {
            border-bottom: none;
        }
        .message-text {
            display: block;
            margin-bottom: 0.25rem;
        }
        .message-time {
            font-size: 0.8rem;
            color: #888;
        }
        form {
            display: flex;
            gap: 10px;
        }
        input {
            flex-grow: 1;
            padding: 0.5rem;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 0.5rem 1rem;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Message Board</h1>
    <ul id="messages"></ul>
    <form id="message-form">
        <input type="text" id="message-input" placeholder="Type a message..." required>
        <button type="submit">Send</button>
    </form>
    <script type="module" src="/main.js"></script>
</body>
</html>
