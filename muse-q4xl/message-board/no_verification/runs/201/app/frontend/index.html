<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Message Board</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 1rem; }
    #messages { list-style: none; padding: 0; margin: 0 0 1rem 0; }
    #messages li { padding: 8px 12px; border-bottom: 1px solid #eee; }
    #messages li small { color: #666; display: block; font-size: 0.8em; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 8px; font-size: 1rem; }
    button { padding: 8px 16px; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Message Board</h1>
  <ul id="messages"></ul>
  <form id="messageForm">
    <input id="messageInput" placeholder="Enter message..." autocomplete="off" required />
    <button type="submit">Send</button>
  </form>
  <script type="module" src="/main.js"></script>
</body>
</html>
