<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realtime Message Board</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 600px;
            margin: 2rem auto;
            padding: 0 1rem;
            display: flex;
            flex-direction: column;
            height: 90vh;
        }
        #message-list {
            flex-grow: 1;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .message {
            padding: 0.5rem;
            background: #f4f4f4;
            border-radius: 4px;
            word-break: break-word;
        }
        .message .timestamp {
            font-size: 0.75rem;
            color: #666;
            margin-bottom: 0.2rem;
        }
        #message-form {
            display: flex;
            gap: 0.5rem;
        }
        #message-input {
            flex-grow: 1;
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #submit-button {
            padding: 0.5rem 1rem;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #submit-button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Message Board</h1>
    <div id="message-list"></div>
    <form id="message-form">
        <input type="text" id="message-input" placeholder="Type a message..." required>
        <button type="submit" id="submit-button">Send</button>
    </form>
    <script type="module" src="/src/app.js"></script>
</body>
</html>
