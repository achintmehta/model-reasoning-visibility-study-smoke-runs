<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message Board</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    h1 {
      text-align: center;
      margin-bottom: 24px;
      color: #16213e;
      font-size: 28px;
      font-weight: 700;
    }

    .form-wrapper {
      background: white;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      margin-bottom: 20px;
    }

    form {
      display: flex;
      gap: 10px;
    }

    #message-input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e1e5ea;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    #message-input:focus {
      border-color: #4361ee;
    }

    #message-input::placeholder {
      color: #a0a5ab;
    }

    #send-btn {
      padding: 12px 24px;
      background: #4361ee;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      transition: background 0.2s;
    }

    #send-btn:hover {
      background: #3a56d4;
    }

    #send-btn:active {
      background: #2f4bbf;
    }

    .status {
      text-align: center;
      margin-bottom: 16px;
      font-size: 13px;
      color: #6c757d;
    }

    .status.connected {
      color: #2ecc71;
    }

    .status.disconnected {
      color: #e74c3c;
    }

    #message-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #message-list li {
      background: white;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      animation: fadeIn 0.3s ease;
    }

    #message-list li .message-text {
      font-size: 15px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    #message-list li .message-time {
      font-size: 12px;
      color: #8899a6;
      margin-top: 8px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #8899a6;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>💬 Message Board</h1>

    <div class="form-wrapper">
      <form id="message-form">
        <input
          type="text"
          id="message-input"
          placeholder="Type a message..."
          autocomplete="off"
          required
        >
        <button type="submit" id="send-btn">Send</button>
      </form>
    </div>

    <div id="connection-status" class="status disconnected">Connecting...</div>

    <ul id="message-list">
      <li class="empty-state">No messages yet. Be the first to post!</li>
    </ul>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
