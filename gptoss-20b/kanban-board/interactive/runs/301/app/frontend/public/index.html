<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanban Board</title>
  <style>
    body { font-family: sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
    #board { display: flex; gap: 12px; padding: 12px; }
    .column { background: white; padding: 8px; border-radius: 4px; width: 200px; display: flex; flex-direction: column; min-height: 200px; }
    .column h2 { text-align: center; }
    .card { background: #e3e3e3; margin: 4px 0; padding: 6px; border-radius: 4px; cursor: grab; }
    .add-card { margin-top: auto; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="../src/main.js"></script>
</body>
</html>
