<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanban Board</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 1rem; background: #f0f0f0; }
    .board { display: flex; gap: 1rem; }
    .column { background: #e0e0e0; padding: 0.5rem; border-radius: 4px; flex: 1; display: flex; flex-direction: column; }
    .column-header { font-weight: bold; margin-bottom: 0.5rem; }
    .card { background: #fff; padding: 0.5rem; margin-bottom: 0.5rem; border-radius: 4px; cursor: grab; } 
    .card:active { cursor: grabbing; }
    .add-card { margin-top: auto; }
    input[type=text] { width: 100%; padding: 0.3rem; }
  </style>
</head>
<body>
  <h1>Kanban Board</h1>
  <div id="board" class="board"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
