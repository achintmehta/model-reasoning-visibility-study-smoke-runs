<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Realtime Message Board</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    #messages { border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: auto; }
    .message { margin-bottom: 8px; }
    #form { margin-top: 10px; }
    #text { width: 80%; }
  </style>
</head>
<body>
  <h1>Realtime Message Board</h1>
  <div id="messages"></div>
  <form id="form">
    <input type="text" id="text" required placeholder="Enter message" />
    <button type="submit">Send</button>
  </form>
  <script>
    const API_BASE = 'http://localhost:3000/api';
    const messagesEl = document.getElementById('messages');

    function addMessage(msg) {
      const div = document.createElement('div');
      div.className = 'message';
      div.textContent = `${msg.id}: ${msg.text} (${new Date(msg.created_at).toLocaleTimeString()})`;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function loadHistory() {
      const res = await fetch(`${API_BASE}/messages`);
      const data = await res.json();
      data.forEach(addMessage);
    }

    function setupSSE() {
      const es = new EventSource(`${API_BASE}/stream`);
      es.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        addMessage(msg);
      };
      es.onerror = (err) => {
        console.error('SSE error', err);
      };
    }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = document.getElementById('text').value;
      await fetch(`${API_BASE}/messages`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
      document.getElementById('text').value = '';
    });

    loadHistory();
    setupSSE();
  </script>
</body>
</html>
