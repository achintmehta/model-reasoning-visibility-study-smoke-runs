<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Realtime Board</title>
  <style>
    body {font-family: sans-serif; margin: 2rem;}
    #messages {border: 1px solid #ccc; padding: 1rem; height: 400px; overflow-y: auto;}
    #message-form {margin-top: 1rem;}
    textarea {width: 100%;}
    div.message {margin-bottom: 0.5rem;}
  </style>
</head>
<body>
  <h1>Realtime Board</h1>
  <div id="messages"></div>
  <form id="message-form">
    <textarea id="text" rows="3" placeholder="Type your message"></textarea><br>
    <button type="submit">Send</button>
  </form>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
