<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanban Board</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
      background: #0079bf;
      min-height: 100vh;
      color: #172b4d;
    }

    .board {
      display: flex;
      gap: 12px;
      padding: 20px;
      overflow-x: auto;
      min-height: 100vh;
      align-items: flex-start;
    }

    .column {
      background: #ebecf0;
      border-radius: 8px;
      min-width: 280px;
      max-width: 280px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 40px);
    }

    .column-header {
      font-weight: 600;
      font-size: 14px;
      padding: 6px 8px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .column-header .card-count {
      background: rgba(0,0,0,0.1);
      border-radius: 10px;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: normal;
    }

    .cards-list {
      flex: 1;
      overflow-y: auto;
      min-height: 40px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 2px;
    }

    .card {
      background: white;
      border-radius: 6px;
      padding: 8px 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
      cursor: grab;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
      position: relative;
      transition: opacity 0.15s, transform 0.15s;
    }

    .card:hover {
      background: #f4f5f7;
    }

    .card.dragging {
      opacity: 0.5;
      transform: rotate(3deg);
    }

    .card.drag-over {
      border-top: 2px solid #0079bf;
    }

    .card.drop-above {
      border-top: 3px solid #5aac44;
    }

    .card.drop-below {
      border-bottom: 3px solid #5aac44;
    }

    .add-card-form {
      margin-top: 8px;
    }

    .add-card-input {
      width: 100%;
      padding: 8px 12px;
      border: 2px solid transparent;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      background: rgba(0,0,0,0.05);
      outline: none;
      transition: border-color 0.15s;
    }

    .add-card-input:focus {
      border-color: #0079bf;
    }

    .add-card-btn {
      margin-top: 6px;
      padding: 6px 12px;
      background: #0079bf;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
    }

    .add-card-btn:hover {
      background: #026aa7;
    }

    .add-card-cancel {
      display: none;
      margin-top: 4px;
      font-size: 13px;
      color: #5e6c84;
      cursor: pointer;
      padding: 4px 0;
    }

    .add-card-cancel:hover {
      color: #172b4d;
    }

    .drop-placeholder {
      background: rgba(0, 121, 191, 0.1);
      border: 2px dashed #0079bf;
      border-radius: 6px;
      height: 40px;
      transition: height 0.15s;
    }

    .status-bar {
      position: fixed;
      bottom: 10px;
      right: 10px;
      padding: 6px 12px;
      background: rgba(0,0,0,0.7);
      color: white;
      border-radius: 6px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #5aac44;
    }

    .status-dot.disconnected {
      background: #ff5630;
    }

    .status-dot.connecting {
      background: #ffab00;
    }
  </style>
</head>
<body>
  <div class="board" id="board"></div>
  <div class="status-bar" id="statusBar">
    <span class="status-dot connecting" id="statusDot"></span>
    <span id="statusText">Connecting...</span>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
