<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanban Board</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
      background: #f4f5f7;
      color: #172b4d;
      min-height: 100vh;
    }

    .board {
      display: flex;
      gap: 16px;
      padding: 20px;
      overflow-x: auto;
      min-height: calc(100vh - 60px);
      align-items: flex-start;
    }

    .column {
      background: #ebecf0;
      border-radius: 12px;
      min-width: 280px;
      max-width: 280px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 100px);
    }

    .column-header {
      font-weight: 700;
      font-size: 15px;
      padding: 8px 4px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .column-header .card-count {
      background: #dfe1e6;
      border-radius: 10px;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: 500;
    }

    .cards-container {
      flex: 1;
      overflow-y: auto;
      min-height: 40px;
      padding: 2px;
    }

    .cards-container.drag-over {
      background: rgba(0, 0, 0, 0.05);
      border-radius: 8px;
    }

    .card {
      background: white;
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 8px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
      cursor: grab;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
      transition: opacity 0.15s, transform 0.15s;
      user-select: none;
    }

    .card:hover {
      background: #f4f5f7;
    }

    .card.dragging {
      opacity: 0.5;
      transform: rotate(2deg);
    }

    .card.drag-placeholder {
      background: #e2e4e9;
      border: 2px dashed #c0c4cc;
      min-height: 36px;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .add-card-form {
      margin-top: 8px;
    }

    .add-card-input {
      width: 100%;
      padding: 8px 10px;
      border: 2px solid #dfe1e6;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      resize: none;
      min-height: 36px;
      transition: border-color 0.15s;
    }

    .add-card-input:focus {
      border-color: #0079bf;
    }

    .add-card-btn {
      margin-top: 6px;
      padding: 6px 14px;
      background: #0079bf;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .add-card-btn:hover {
      background: #026aa7;
    }

    .add-card-cancel {
      margin-left: 6px;
      padding: 6px 10px;
      background: transparent;
      color: #5e6c84;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }

    .add-card-cancel:hover {
      background: rgba(0, 0, 0, 0.05);
    }

    h1 {
      background: #0079bf;
      color: white;
      padding: 14px 20px;
      font-size: 18px;
      font-weight: 700;
    }

    .status-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 4px 16px;
      font-size: 12px;
      color: #5e6c84;
      background: #f4f5f7;
      border-top: 1px solid #dfe1e6;
    }

    .status-bar .connected {
      color: #00c853;
    }

    .status-bar .disconnected {
      color: #ff3d00;
    }
  </style>
</head>
<body>
  <h1>Kanban Board</h1>
  <div class="board" id="board"></div>
  <div class="status-bar" id="status">Connecting...</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
